name: loqua

services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
    environment:
      SUPABASE_URL: ${API_SUPABASE_ISSUER:-http://127.0.0.1:54321}
      SUPABASE_JWKS_URL: ${API_SUPABASE_JWKS_URL:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081,http://localhost}
      API_DEBUG_ERRORS: ${API_DEBUG_ERRORS:-0}
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8787:8787'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/app/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

  powersync-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: powersync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POWERSYNC_DB_PASSWORD:-powersync}
    volumes:
      - powersync_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d powersync']
      interval: 5s
      timeout: 3s
      retries: 20

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ['start', '-r', 'unified']
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:-postgresql://powersync_role:powersync@host.docker.internal:54322/postgres}
      PS_STORAGE_URI: ${PS_STORAGE_URI:-postgresql://postgres:powersync@powersync-db:5432/powersync}
      PS_JWKS_URI: ${PS_JWKS_URI:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
      PS_PORT: ${PS_PORT:-8080}
      PS_SSL_MODE: ${PS_SSL_MODE:-disable}
      PS_API_TOKEN: ${POWERSYNC_API_TOKEN:-dev-only-change-me}
    volumes:
      - ./powersync:/config:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      powersync-db:
        condition: service_healthy
    ports:
      - '${PS_PORT:-8080}:${PS_PORT:-8080}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:' + process.env.PS_PORT + '/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 15

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - uptime_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  powersync_data:
  uptime_data:
