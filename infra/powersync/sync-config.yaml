# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM users WHERE id = auth.user_id()
      - SELECT * FROM learner_profiles WHERE user_id = auth.user_id()
      - SELECT * FROM consents WHERE user_id = auth.user_id()
      - SELECT * FROM devices WHERE user_id = auth.user_id()
      - SELECT * FROM settings WHERE user_id = auth.user_id()
      - SELECT * FROM sync_state WHERE user_id = auth.user_id()
      - SELECT * FROM sync_conflict_log WHERE user_id = auth.user_id()
      - SELECT * FROM backup_meta WHERE user_id = auth.user_id()
